name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install -r requirements-dev.txt

      - name: Run ruff check
        run: ruff check --line-length=160 .

      - name: Run ruff format check
        run: ruff format --line-length=160 --check .
