apiVersion: v1
kind: Pod
metadata:
  name: ds18b20-mqtt
  labels:
    app: ds18b20-mqtt
spec:
  restartPolicy: Always
  containers:
    - name: ds18b20-mqtt
      image: localhost/ds18b20-mqtt:latest
      securityContext:
        privileged: true
      env:
        - name: MQTT_HOST
          value: "192.168.1.10"
        - name: MQTT_PORT
          value: "1883"
        - name: MQTT_USERNAME
          value: ""
        - name: MQTT_PASSWORD
          value: ""
        - name: MQTT_CLIENT_ID
          value: "ds18b20-mqtt"
        - name: SENSOR_NAME
          value: "external"
        - name: SENSOR_UNIT
          value: "C"
        - name: INTERVAL
          value: "30"
        - name: STATE_TOPIC
          value: "DS18B20/external/temp"
        - name: HASS_DISCOVERY_PREFIX
          value: "homeassistant"
        - name: HASS_DISCOVERY
          value: "true"
        - name: LOG_LEVEL
          value: "INFO"
      volumeMounts:
        - name: w1-devices
          mountPath: /sys/bus/w1/devices
          readOnly: true
  volumes:
    - name: w1-devices
      hostPath:
        path: /sys/bus/w1/devices
        type: Directory
